openapi: 3.0.3
info:
  title: FR-04.2 Update Trip Status API
  description: Tài xế cập nhật trạng thái chuyến đi (ARRIVING, PICKED_UP, 
    IN_PROGRESS, COMPLETED).
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /driver/trips/{tripId}/status:
    patch:
      summary: Cập nhật trạng thái chuyến đi
      operationId: updateTripStatus
      parameters:
        - in: path
          name: tripId
          required: true
          schema:
            type: string
            example: "TRIP-9901"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ARRIVING, PICKED_UP, IN_PROGRESS, COMPLETED]
                  example: "PICKED_UP"
                latitude:
                  type: number
                  example: 10.7721
                longitude:
                  type: number
                  example: 106.6578
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      trip_id:
                        type: string
                        example: "TRIP-9901"
                      current_status:
                        type: string
                        example: "PICKED_UP"
                      updated_at:
                        type: string
                        example: "2026-09-09T08:42:00Z"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
