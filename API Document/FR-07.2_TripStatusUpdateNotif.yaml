openapi: 3.0.3
info:
  title: FR-07.2 Trip Status Update Notification API
  description: Gửi thông báo thay đổi trạng thái chuyến đi cho Khách/Tài xế.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /notifications/trip-status-update:
    post:
      summary: Gửi thông báo cập nhật trạng thái chuyến đi
      operationId: sendTripStatusUpdateNotif
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipient_id
                - trip_id
                - new_status
              properties:
                recipient_id:
                  type: string
                  example: "CUST-10023"
                trip_id:
                  type: string
                  example: "TRIP-9901"
                new_status:
                  type: string
                  example: "ARRIVING"
      responses:
        '200':
          description: Đã phát thông báo
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Thông báo đã được đẩy tới thiết bị"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
