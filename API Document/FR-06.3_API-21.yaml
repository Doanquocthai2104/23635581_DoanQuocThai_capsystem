openapi: 3.0.3
info:
  title: CAB System - FR-06.3 / API-21
  description: 'FR-06.3 - Notify payment result. API: API-21. Business Requirement:
    BR-06: Thông báo.'
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com
  description: Production Server
- url: http://localhost:8080
  description: Local Development Server
tags:
- name: 'BR-06: Thông báo'
  description: Các API gửi thông báo cho khách hàng và tài xế.
paths:
  /api/v1/notifications/payment:
    post:
      tags:
      - 'BR-06: Thông báo'
      summary: Notify payment result
      description: Sends payment result information to the customer.
      operationId: notifyPayment
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - status
              properties:
                customerId:
                  type: string
                  example: CUS001
                status:
                  type: string
                  example: SUCCESS
      responses:
        '200':
          description: Payment notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: object
                    additionalProperties: true
        '400':
          description: Invalid payment notification data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorCode:
                    type: string
                    example: INVALID_REQUEST
                  message:
                    type: string
                    example: Invalid request data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
