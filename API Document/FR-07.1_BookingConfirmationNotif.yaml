openapi: 3.0.3
info:
  title: FR-07.1 Booking Confirmation Notification API
  description: Gửi thông báo Push Notification/SMS xác nhận tiếp nhận đặt xe.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /notifications/booking-confirmation:
    post:
      summary: Gửi thông báo xác nhận đặt xe
      operationId: sendBookingConfirmationNotif
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - trip_id
              properties:
                customer_id:
                  type: string
                  example: "CUST-10023"
                trip_id:
                  type: string
                  example: "TRIP-9901"
      responses:
        '200':
          description: Đã gửi thông báo
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Thông báo đã gửi thành công"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
