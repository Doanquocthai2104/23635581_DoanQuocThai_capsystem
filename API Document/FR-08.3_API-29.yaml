openapi: 3.0.3
info:
  title: CAB System - FR-08.3 / API-29
  description: 'FR-08.3 - Protect sensitive data. API: API-29. Business Requirement:
    BR-08: Bảo mật & dữ liệu.'
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com
  description: Production Server
- url: http://localhost:8080
  description: Local Development Server
tags:
- name: 'BR-08: Bảo mật & dữ liệu'
  description: Các API phục vụ xác thực, phân quyền, bảo vệ dữ liệu và audit log.
paths:
  /api/v1/security/data-protection:
    post:
      tags:
      - 'BR-08: Bảo mật & dữ liệu'
      summary: Protect sensitive data
      description: Applies the requested data protection action to a protected resource.
      operationId: protectSensitiveData
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataType
              - resourceId
              - action
              properties:
                dataType:
                  type: string
                  example: CUSTOMER_PERSONAL_DATA
                resourceId:
                  type: string
                  example: CUS001
                action:
                  type: string
                  enum:
                  - PROTECT
                  - ENCRYPT
                  - MASK
                  example: PROTECT
      responses:
        '200':
          description: Data protection action completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: object
                    additionalProperties: true
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorCode:
                    type: string
                    example: INVALID_REQUEST
                  message:
                    type: string
                    example: Invalid request data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
