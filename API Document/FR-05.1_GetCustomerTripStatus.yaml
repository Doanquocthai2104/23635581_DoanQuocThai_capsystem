openapi: 3.0.3
info:
  title: FR-05.1 Get Customer Trip Status API
  description: Lấy trạng thái hiện tại của chuyến đi dành cho Khách hàng.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /customers/trips/{tripId}/status:
    get:
      summary: Lấy trạng thái chuyến đi của khách hàng
      operationId: getCustomerTripStatus
      parameters:
        - in: path
          name: tripId
          required: true
          schema:
            type: string
            example: "TRIP-9901"
      responses:
        '200':
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      trip_id:
                        type: string
                        example: "TRIP-9901"
                      status:
                        type: string
                        example: "IN_PROGRESS"
                      eta_minutes:
                        type: integer
                        example: 12
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
