openapi: 3.0.3
info:
  title: CAB System - FR-03.2 / API-10
  description: 'FR-03.2 - Update trip status. API: API-10. Business Requirement: BR-03:
    Thực hiện chuyến.'
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com
  description: Production Server
- url: http://localhost:8080
  description: Local Development Server
tags:
- name: 'BR-03: Thực hiện chuyến'
  description: Các API phục vụ tài xế nhận và thực hiện chuyến.
paths:
  /api/v1/trips/{tripId}/status:
    put:
      tags:
      - 'BR-03: Thực hiện chuyến'
      summary: Update trip status
      description: Updates the current status of a trip.
      operationId: updateTripStatus
      security:
      - bearerAuth: []
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        example: TR001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - ARRIVED_PICKUP
                  - PICKED_UP
                  - IN_PROGRESS
                  - COMPLETED
                  example: IN_PROGRESS
      responses:
        '200':
          description: Trip status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: object
                    additionalProperties: true
        '400':
          description: Invalid trip status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorCode:
                    type: string
                    example: INVALID_REQUEST
                  message:
                    type: string
                    example: Invalid request data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
