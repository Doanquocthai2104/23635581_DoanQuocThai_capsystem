openapi: 3.0.3
info:
  title: CAB System - FR-06.2 / API-20
  description: 'FR-06.2 - Notify trip status change. API: API-20. Business Requirement:
    BR-06: Thông báo.'
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com
  description: Production Server
- url: http://localhost:8080
  description: Local Development Server
tags:
- name: 'BR-06: Thông báo'
  description: Các API gửi thông báo cho khách hàng và tài xế.
paths:
  /api/v1/notifications/trip-status:
    post:
      tags:
      - 'BR-06: Thông báo'
      summary: Notify trip status change
      description: Sends a trip status change notification to the customer.
      operationId: notifyTripStatusChange
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tripId
              - customerId
              - status
              properties:
                tripId:
                  type: string
                  example: TR001
                customerId:
                  type: string
                  example: CUS001
                status:
                  type: string
                  example: DRIVER_ACCEPTED
      responses:
        '200':
          description: Trip status notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: object
                    additionalProperties: true
        '400':
          description: Invalid trip notification data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorCode:
                    type: string
                    example: INVALID_REQUEST
                  message:
                    type: string
                    example: Invalid request data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
