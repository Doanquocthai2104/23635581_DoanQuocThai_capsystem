openapi: 3.0.3
info:
  title: CAB System - FR-04.1 / API-12
  description: 'FR-04.1 - Get trip status. API: API-12. Business Requirement: BR-04:
    Theo dõi chuyến.'
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com
  description: Production Server
- url: http://localhost:8080
  description: Local Development Server
tags:
- name: 'BR-04: Theo dõi chuyến'
  description: Các API phục vụ khách hàng theo dõi trạng thái và thông tin chuyến.
paths:
  /api/v1/trips/{tripId}/status:
    get:
      tags:
      - 'BR-04: Theo dõi chuyến'
      summary: Get trip status
      description: Returns the current status of a trip.
      operationId: getTripStatus
      security:
      - bearerAuth: []
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        example: TR001
      responses:
        '200':
          description: Trip status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: object
                    additionalProperties: true
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorCode:
                    type: string
                    example: INVALID_REQUEST
                  message:
                    type: string
                    example: Invalid request data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
