openapi: 3.0.3
info:
  title: FR-01.3 Customer Profile API (Get & Update)
  description: Xem và cập nhật thông tin cá nhân của khách hàng.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /customers/me:
    get:
      summary: Xem thông tin cá nhân
      operationId: getCustomerProfile
      responses:
        '200':
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                        example: "CUST-10023"
                      full_name:
                        type: string
                        example: "Nguyen Van A"
                      phone_number:
                        type: string
                        example: "+84987654321"
                      email:
                        type: string
                        example: "nguyenvana@example.com"
                      avatar_url:
                        type: string
                        example: "https://storage.taxiapp.com/avatars/cust-10023.jpg"
                      rating:
                        type: number
                        example: 4.9
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  error_code:
                    type: string
                    example: "UNAUTHORIZED"
                  message:
                    type: string
                    example: "Token không hợp lệ"

      security:
        - bearerAuth: []
    put:
      summary: Cập nhật thông tin cá nhân
      operationId: updateCustomerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: "Nguyen Van B"
                email:
                  type: string
                  example: "nguyenvanb@example.com"
                avatar_url:
                  type: string
                  example: "https://storage.taxiapp.com/avatars/new-avatar.jpg"
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Cập nhật thông tin thành công"
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                        example: "CUST-10023"
                      full_name:
                        type: string
                        example: "Nguyen Van B"
                      email:
                        type: string
                        example: "nguyenvanb@example.com"
                      avatar_url:
                        type: string
                        example: "https://storage.taxiapp.com/avatars/new-avatar.jpg"
        '400':
          description: Dữ liệu gửi lên không đúng dạng
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  error_code:
                    type: string
                    example: "INVALID_EMAIL_FORMAT"
                  message:
                    type: string
                    example: "Email không hợp lệ"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
