openapi: 3.0.3
info:
  title: CAB System - FR-07.1 / API-23
  description: 'FR-07.1 - Manage operational resources. API: API-23. Business Requirement:
    BR-07: Quản lý vận hành.'
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com
  description: Production Server
- url: http://localhost:8080
  description: Local Development Server
tags:
- name: 'BR-07: Quản lý vận hành'
  description: Các API hỗ trợ nhân viên quản lý và giám sát vận hành.
paths:
  /api/v1/operations/resources:
    get:
      tags:
      - 'BR-07: Quản lý vận hành'
      summary: Manage operational resources
      description: Returns customers, drivers or vehicles for operation staff.
      operationId: getOperationalResources
      security:
      - bearerAuth: []
      parameters:
      - name: resourceType
        in: query
        required: true
        schema:
          type: string
          enum:
          - customers
          - drivers
          - vehicles
        example: drivers
      responses:
        '200':
          description: Resources returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: object
                    additionalProperties: true
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorCode:
                    type: string
                    example: INVALID_REQUEST
                  message:
                    type: string
                    example: Invalid request data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
