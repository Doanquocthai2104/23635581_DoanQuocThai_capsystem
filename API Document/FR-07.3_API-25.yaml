openapi: 3.0.3
info:
  title: CAB System - FR-07.3 / API-25
  description: 'FR-07.3 - Query trip and transaction history. API: API-25. Business
    Requirement: BR-07: Quản lý vận hành.'
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com
  description: Production Server
- url: http://localhost:8080
  description: Local Development Server
tags:
- name: 'BR-07: Quản lý vận hành'
  description: Các API hỗ trợ nhân viên quản lý và giám sát vận hành.
paths:
  /api/v1/operations/transactions:
    get:
      tags:
      - 'BR-07: Quản lý vận hành'
      summary: Query trip and transaction history
      description: Returns historical trip and transaction information for operation
        staff.
      operationId: getTransactionHistory
      security:
      - bearerAuth: []
      parameters:
      - name: fromDate
        in: query
        required: false
        schema:
          type: string
          format: date
        example: '2026-09-01'
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date
        example: '2026-09-07'
      responses:
        '200':
          description: Transaction history returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: object
                    additionalProperties: true
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorCode:
                    type: string
                    example: INVALID_REQUEST
                  message:
                    type: string
                    example: Invalid request data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
