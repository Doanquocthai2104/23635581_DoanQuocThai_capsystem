openapi: 3.0.3
info:
  title: FR-08.1 Admin Customer Management API
  description: Quản trị danh sách và trạng thái tài khoản khách hàng dành cho 
    Admin.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /admin/customers:
    get:
      summary: Tra cứu danh sách tài khoản khách hàng
      operationId: adminListCustomers
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
            example: "Nguyen Van A"
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        customer_id:
                          type: string
                          example: "CUST-10023"
                        full_name:
                          type: string
                          example: "Nguyen Van A"
                        status:
                          type: string
                          example: "ACTIVE"

      security:
        - bearerAuth: []
  /admin/customers/{customerId}/status:
    patch:
      summary: Kích hoạt / Khóa tài khoản khách hàng
      operationId: adminUpdateCustomerStatus
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
            example: "CUST-10023"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACTIVE, BLOCKED]
                  example: "BLOCKED"
                reason:
                  type: string
                  example: "Vi phạm chính sách đặt chuyến"
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Đã chuyển trạng thái tài khoản thành BLOCKED"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
