openapi: 3.0.3
info:
  title: CAB System - FR-05.4 / API-18
  description: 'FR-05.4 - Notify payment result. API: API-18. Business Requirement:
    BR-05: Tính cước & thanh toán.'
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com
  description: Production Server
- url: http://localhost:8080
  description: Local Development Server
tags:
- name: 'BR-05: Tính cước & thanh toán'
  description: Các API phục vụ tính cước và xử lý thanh toán.
paths:
  /api/v1/payments/{paymentId}/notify:
    post:
      tags:
      - 'BR-05: Tính cước & thanh toán'
      summary: Notify payment result
      description: Sends the payment result to the customer.
      operationId: notifyPaymentResult
      security:
      - bearerAuth: []
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
        example: PAY001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - status
              properties:
                customerId:
                  type: string
                  example: CUS001
                status:
                  type: string
                  example: SUCCESS
      responses:
        '200':
          description: Payment notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: object
                    additionalProperties: true
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorCode:
                    type: string
                    example: INVALID_REQUEST
                  message:
                    type: string
                    example: Invalid request data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
