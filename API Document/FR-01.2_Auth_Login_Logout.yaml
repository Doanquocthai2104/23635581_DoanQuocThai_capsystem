openapi: 3.0.3
info:
  title: FR-01.2 Customer Auth API (Login & Logout)
  description: Quản lý phiên đăng nhập và đăng xuất của khách hàng.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /auth/login:
    post:
      summary: Đăng nhập tài khoản
      operationId: loginCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_number
                - password
              properties:
                phone_number:
                  type: string
                  example: "+84987654321"
                password:
                  type: string
                  format: password
                  example: "P@ssw0rd123"
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Đăng nhập thành công"
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token:
                        type: string
                        example: "d9b2d63d-ceb0-4070-a9ae-d123456789ab"
                      expires_in:
                        type: integer
                        example: 86400
        '401':
          description: Thông tin đăng nhập không chính xác
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  error_code:
                    type: string
                    example: "INVALID_CREDENTIALS"
                  message:
                    type: string
                    example: "Số điện thoại hoặc mật khẩu không đúng"

  /auth/logout:
    post:
      summary: Đăng xuất khỏi hệ thống
      operationId: logoutCustomer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  example: "d9b2d63d-ceb0-4070-a9ae-d123456789ab"
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Đã đăng xuất thành công"
        '401':
          description: Token không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  error_code:
                    type: string
                    example: "UNAUTHORIZED"
                  message:
                    type: string
                    example: "Token không hợp lệ hoặc đã hết hạn"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
