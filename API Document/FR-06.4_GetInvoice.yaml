openapi: 3.0.3
info:
  title: FR-06.4 Get Invoice API
  description: Trả về hóa đơn chi tiết của chuyến đi cho khách hàng.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /payments/invoices/{tripId}:
    get:
      summary: Trả về hóa đơn và kết quả thanh toán
      operationId: getTripInvoice
      parameters:
        - in: path
          name: tripId
          required: true
          schema:
            type: string
            example: "TRIP-9901"
      responses:
        '200':
          description: Lấy hóa đơn thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      invoice_number:
                        type: string
                        example: "INV-2026-0909-01"
                      trip_id:
                        type: string
                        example: "TRIP-9901"
                      total_amount:
                        type: number
                        example: 69000
                      payment_method:
                        type: string
                        example: "MOMO"
                      paid_at:
                        type: string
                        example: "2026-09-09T08:55:00Z"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
