openapi: 3.0.3
info:
  title: CAB System - FR-08.4 / API-30
  description: 'FR-08.4 - Get audit logs. API: API-30. Business Requirement: BR-08:
    Bảo mật & dữ liệu.'
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com
  description: Production Server
- url: http://localhost:8080
  description: Local Development Server
tags:
- name: 'BR-08: Bảo mật & dữ liệu'
  description: Các API phục vụ xác thực, phân quyền, bảo vệ dữ liệu và audit log.
paths:
  /api/v1/security/audit-logs:
    get:
      tags:
      - 'BR-08: Bảo mật & dữ liệu'
      summary: Get audit logs
      description: Returns audit logs for important administrative actions.
      operationId: getAuditLogs
      security:
      - bearerAuth: []
      parameters:
      - name: fromDate
        in: query
        required: false
        schema:
          type: string
          format: date
        example: '2026-09-01'
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date
        example: '2026-09-07'
      - name: userId
        in: query
        required: false
        schema:
          type: string
        example: OP001
      responses:
        '200':
          description: Audit logs returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: object
                    additionalProperties: true
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorCode:
                    type: string
                    example: INVALID_REQUEST
                  message:
                    type: string
                    example: Invalid request data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
