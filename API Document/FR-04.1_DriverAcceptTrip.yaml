openapi: 3.0.3
info:
  title: FR-04.1 Driver Accept Trip API
  description: Cho phép tài xế tiếp nhận chuyến xe từ phía Driver App.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /driver/trips/{tripId}/accept:
    post:
      summary: Tài xế tiếp nhận chuyến xe
      operationId: driverAcceptTrip
      parameters:
        - in: path
          name: tripId
          required: true
          schema:
            type: string
            example: "TRIP-9901"
      responses:
        '200':
          description: Nhận chuyến thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      trip_id:
                        type: string
                        example: "TRIP-9901"
                      status:
                        type: string
                        example: "ARRIVING"
                      customer_info:
                        type: object
                        properties:
                          name:
                            type: string
                            example: "Nguyen Van A"
                          phone:
                            type: string
                            example: "+84987654321"
        '409':
          description: Chuyến đã bị hủy hoặc được gán cho người khác
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 409
                  error_code:
                    type: string
                    example: "TRIP_ALREADY_TAKEN"
                  message:
                    type: string
                    example: "Chuyến đi này đã được tiếp nhận bởi tài xế khác"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
