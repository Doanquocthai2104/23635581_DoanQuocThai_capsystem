openapi: 3.0.3
info:
  title: FR-08.2 Admin Driver Approval API
  description: Duyệt hồ sơ và phương tiện của tài xế.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /admin/drivers/{driverId}/approval:
    put:
      summary: Duyệt / Quản lý phương tiện tài xế
      operationId: adminApproveDriver
      parameters:
        - in: path
          name: driverId
          required: true
          schema:
            type: string
            example: "DRV-501"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approval_status
              properties:
                approval_status:
                  type: string
                  enum: [APPROVED, REJECTED]
                  example: "APPROVED"
                rejection_reason:
                  type: string
                  example: ""
      responses:
        '200':
          description: Duyệt thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Tài xế đã được phê duyệt vận hành"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
