openapi: 3.0.3
info:
  title: FR-07.4 Driver Dispatch Notification API
  description: Gửi thông báo điều xe (chuyến mới) tới ứng dụng của Tài xế.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /notifications/driver-dispatch:
    post:
      summary: Gửi thông báo chuyến mới cho tài xế
      operationId: sendDriverDispatchNotif
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - driver_id
                - trip_id
              properties:
                driver_id:
                  type: string
                  example: "DRV-501"
                trip_id:
                  type: string
                  example: "TRIP-9901"
                pickup_address:
                  type: string
                  example: "268 Lý Thường Kiệt, Q.10"
      responses:
        '200':
          description: Gửi thông báo điều xe thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Push dispatch notification sent"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
