openapi: 3.0.3
info:
  title: FR-06.3 Payment Transactions API
  description: Ghi nhận kết quả giao dịch thanh toán vào cơ sở dữ liệu.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /payments/transactions:
    post:
      summary: Ghi nhận kết quả giao dịch
      operationId: recordTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - amount
                - status
                - transaction_ref
              properties:
                trip_id:
                  type: string
                  example: "TRIP-9901"
                amount:
                  type: number
                  example: 69000
                status:
                  type: string
                  enum: [SUCCESS, FAILED]
                  example: "SUCCESS"
                transaction_ref:
                  type: string
                  example: "MOMO_TX_88129031"
      responses:
        '201':
          description: Lưu giao dịch thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: string
                        example: "TX-10029"
                      status:
                        type: string
                        example: "SUCCESS"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
