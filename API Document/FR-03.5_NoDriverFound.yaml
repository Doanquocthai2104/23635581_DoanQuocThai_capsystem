openapi: 3.0.3
info:
  title: FR-03.5 No Driver Found API
  description: Xử lý khi đã hết số lần tìm kiếm mà không thấy tài xế nào nhận 
    chuyến.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /trips/{tripId}/no-driver-found:
    post:
      summary: Xử lý khi không tìm thấy tài xế
      operationId: handleNoDriverFound
      parameters:
        - in: path
          name: tripId
          required: true
          schema:
            type: string
            example: "TRIP-9901"
      responses:
        '200':
          description: Đã cập nhật trạng thái chuyến đi sang NO_DRIVER
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      trip_id:
                        type: string
                        example: "TRIP-9901"
                      status:
                        type: string
                        example: "NO_DRIVER_FOUND"
                      cancelled_at:
                        type: string
                        example: "2026-09-09T08:37:00Z"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
