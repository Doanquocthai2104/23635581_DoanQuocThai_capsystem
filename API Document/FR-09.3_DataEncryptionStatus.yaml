openapi: 3.0.3
info:
  title: FR-09.3 Privacy & Data Protection API
  description: Trả về trạng thái mã hóa/bảo vệ dữ liệu cá nhân, thông tin vị trí
    và lịch sử giao dịch.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /privacy/data-encryption-status:
    get:
      summary: Kiểm tra trạng thái mã hóa & bảo vệ dữ liệu cá nhân
      operationId: getDataEncryptionStatus
      responses:
        '200':
          description: Trả về thông tin tiêu chuẩn mã hóa đang áp dụng
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      personal_data_encrypted:
                        type: boolean
                        example: true
                      encryption_algorithm:
                        type: string
                        example: "AES-256-GCM"
                      location_data_masked:
                        type: boolean
                        example: true
                      pci_dss_compliant:
                        type: boolean
                        example: true
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
