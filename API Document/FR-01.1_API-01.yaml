openapi: 3.0.3
info:
  title: CAB System - FR-01.1 / API-01
  description: 'FR-01.1 - Provide pickup and destination. API: API-01. Business Requirement:
    BR-01: Đặt xe.'
  version: 1.0.0
servers:
- url: https://api.cabsystem.example.com
  description: Production Server
- url: http://localhost:8080
  description: Local Development Server
tags:
- name: 'BR-01: Đặt xe'
  description: Các API phục vụ chức năng đặt xe.
paths:
  /api/v1/bookings/location:
    post:
      tags:
      - 'BR-01: Đặt xe'
      summary: Provide pickup and destination
      description: Receives pickup and destination information for a booking.
      operationId: provideBookingLocation
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pickupLocation
              - destination
              properties:
                pickupLocation:
                  type: string
                  example: Đại học ABC
                destination:
                  type: string
                  example: Vincom Đồng Khởi
      responses:
        '200':
          description: Location information accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation successful
                  data:
                    type: object
                    additionalProperties: true
        '400':
          description: Invalid location information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorCode:
                    type: string
                    example: INVALID_REQUEST
                  message:
                    type: string
                    example: Invalid request data
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
