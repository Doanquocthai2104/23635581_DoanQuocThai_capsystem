openapi: 3.0.3
info:
  title: FR-07.3 Payment Result Notification API
  description: Gửi thông báo kết quả giao dịch thanh toán.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /notifications/payment-result:
    post:
      summary: Gửi thông báo kết quả thanh toán
      operationId: sendPaymentResultNotif
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - trip_id
                - is_success
                - amount
              properties:
                customer_id:
                  type: string
                  example: "CUST-10023"
                trip_id:
                  type: string
                  example: "TRIP-9901"
                is_success:
                  type: boolean
                  example: true
                amount:
                  type: number
                  example: 69000
      responses:
        '200':
          description: Đã gửi
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Thông báo thanh toán đã được gửi"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
