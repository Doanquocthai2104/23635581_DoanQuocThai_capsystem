openapi: 3.0.3
info:
  title: FR-09.1 Verify Token API
  description: API cổng kiểm tra tính hợp lệ của JWT token cấp quyền truy cập.
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /auth/verify-token:
    post:
      summary: Xác thực token/thông tin đăng nhập
      operationId: verifyToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Token hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                        example: true
                      user_id:
                        type: string
                        example: "CUST-10023"
                      role:
                        type: string
                        example: "CUSTOMER"
                      expires_at:
                        type: integer
                        example: 1773045000
        '401':
          description: Token không hợp lệ hoặc đã bị vô hiệu hóa
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  error_code:
                    type: string
                    example: "TOKEN_EXPIRED"
                  message:
                    type: string
                    example: "Token đã hết hạn sử dụng"
