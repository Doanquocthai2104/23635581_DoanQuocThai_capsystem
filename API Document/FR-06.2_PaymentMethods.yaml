openapi: 3.0.3
info:
  title: FR-06.2 Payment Methods API
  description: Chọn và xử lý phương thức thanh toán cho chuyến đi (Tiền mặt, Ví 
    MoMo, Thẻ).
  version: 1.0.0
servers:
  - url: https://api.taxiapp.com/api/v1
paths:
  /payments/methods:
    post:
      summary: Chọn và xử lý phương thức thanh toán
      operationId: processPaymentMethod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_id
                - payment_method
              properties:
                trip_id:
                  type: string
                  example: "TRIP-9901"
                payment_method:
                  type: string
                  enum: [CASH, MOMO, CREDIT_CARD]
                  example: "MOMO"
      responses:
        '200':
          description: Đăng ký PTTT thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      trip_id:
                        type: string
                        example: "TRIP-9901"
                      payment_method:
                        type: string
                        example: "MOMO"
                      payment_url:
                        type: string
                        example: "https://momo.vn/pay/gateway?token=123"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
